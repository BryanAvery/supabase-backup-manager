name: Specification validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install specification validation dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4,<5'
      - name: Validate documentation and contracts
        run: python scripts/validate_spec.py
      - name: Check accidental secret patterns
        run: |
          if git grep -nE '(sb_secret_|service_role[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!scripts/validate_spec.py'; then
            echo "Potential secret found. Review and remove it."
            exit 1
          fi
