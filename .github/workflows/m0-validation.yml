name: M0 backup and restore validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-recovery-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate isolated recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: m0-recovery
    env:
      M0_SOURCE_URL: ${{ secrets.M0_SOURCE_URL }}
      M0_TARGET_URL: ${{ secrets.M0_TARGET_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check required secrets
        shell: bash
        run: |
          if [[ -z "$M0_SOURCE_URL" || -z "$M0_TARGET_URL" ]]; then
            echo "::error::Configure M0_SOURCE_URL and M0_TARGET_URL as environment secrets."
            exit 1
          fi
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            sudo tee /usr/share/postgresql-common/pgdg/apt.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Bootstrap isolated source fixture (create only if absent)
        run: python3 m0/bootstrap_source.py
      - name: Run two complete recovery validation cycles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          for cycle in 1 2; do
            echo "::group::Recovery validation cycle $cycle"
            if python3 m0/run_m0.py --confirm-isolated-target --reset-managed-fixture --output reports; then
              latest=$(find reports -maxdepth 1 -name 'm0-20*.json' -type f -print | sort | tail -n 1)
              test -n "$latest"
              cp "$latest" "reports/cycle-$cycle-stage1.json"
            else
              latest=$(find reports -maxdepth 1 -name 'm0-20*.json' -type f -print | sort | tail -n 1)
              if [[ -n "$latest" ]]; then
                cp "$latest" "reports/cycle-$cycle-stage1.json"
                python3 m0/print_failures.py "reports/cycle-$cycle-stage1.json"
              else
                echo "::error::Stage 1 exited without writing a JSON report"
              fi
              echo "::endgroup::"
              exit 1
            fi
            if python3 m0/stage2.py --output reports; then
              cp reports/m0-stage2.json "reports/cycle-$cycle-stage2.json"
            else
              if [[ -f reports/m0-stage2.json ]]; then
                cp reports/m0-stage2.json "reports/cycle-$cycle-stage2.json"
                python3 m0/print_failures.py "reports/cycle-$cycle-stage2.json"
              else
                echo "::error::Stage 2 exited without writing a JSON report"
              fi
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Evaluate Stage 3 acceptance
        if: always()
        shell: bash
        run: |
          python3 m0/stage3.py --reports reports || {
            echo "::error::M0 acceptance not achieved. Check the failed-cycle report in the uploaded artefact."
            exit 1
          }
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-validation-report
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 14
